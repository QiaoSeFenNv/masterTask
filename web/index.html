<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071119">
  <meta name="description" content="每天抽一张卡，试着成为一个新的自己。打开卡包，挑选角色，体验揭晓。">
  <title>每日角色 · 体验预览</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./main.js"></script>
</head>
<body>
  <header class="toolbar">
    <div class="brand"><h1>每日角色</h1><span>体验预览</span></div>
    <nav aria-label="预览操作">
      <button type="button" id="copy-link">复制链接</button>
      <button type="button" id="restart">重新体验</button>
    </nav>
  </header>
  <main class="stage">
    <div id="screen"><canvas id="game" aria-label="每日角色互动卡包，按屏幕提示选择和拖动" tabindex="0"></canvas></div>
  </main>
  <footer class="caption"><p id="status" role="status">正在准备今天的卡包…</p><span>体验记录仅保存在当前浏览器</span></footer>
  <dialog id="note-dialog" aria-labelledby="note-title">
    <form id="note-form">
      <h2 id="note-title">今日手记</h2>
      <label for="note-input">记一句今天最想记住的话</label>
      <textarea id="note-input" maxlength="200" rows="5"></textarea>
      <div class="dialog-actions"><button id="note-cancel" type="button">取消</button><button class="primary" type="submit">保存</button></div>
    </form>
  </dialog>
  <noscript>请开启 JavaScript 后体验卡包。</noscript>
</body>
</html>
